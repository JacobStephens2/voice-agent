# Installed at /etc/sysctl.d/60-voice-grok-ptrace.conf.
#
# Model-selected commands run under the same identity as the runner that holds
# the short-lived access token, so file permissions alone do not keep that
# token away from them - a process that can attach to the runner can read it
# out of memory. Yama's restricted scope allows a process to trace only its own
# descendants, and the model's shell is a descendant of the runner rather than
# its ancestor, so this closes the direction that matters.
kernel.yama.ptrace_scope = 1
