# The reviewed sandbox profile, installed at the executor identity's
# $GROK_HOME/sandbox.toml.
#
# A custom profile must live here rather than in the configuration file, and
# may extend only a built-in base. Observed on grok 1.0.13.
#
# It deliberately carries no `deny` list and does not set `restrict_network`.
# Both were tried on this host and both make the runner refuse to start: after
# entering Bubblewrap it re-opens every read-deny path to confirm the mask is
# in effect, and a path the executor identity cannot open at all reports
# `Permission denied`, which it reads as an unenforced deny list. A Grok deny
# of the Auth Crossing would fail the same way; describeSandboxProfileDrift
# refuses any deny list.
#
# This profile holds workspace confinement. Credential stores stay unreadable
# to voice-grok by identity mode and the contract unit. Model-selected
# Bubblewrap children are denied the Auth Crossing by the unpriv_bwrap
# AppArmor overlay. Child-process network restriction remains issue #161.

[profiles.voice-agent-task]
extends = "workspace"
