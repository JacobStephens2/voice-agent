# The reviewed sandbox profile, installed at the executor identity's
# $GROK_HOME/sandbox.toml.
#
# A custom profile must live here rather than in the configuration file, and
# may extend only a built-in base. Observed on grok 1.0.13.
#
# It deliberately carries no `deny` list and does not set `restrict_network`.
# Both were tried on this host and both make the runner refuse to start: after
# entering Bubblewrap it re-opens every read-deny path to confirm the mask is
# in effect, and a path the executor identity cannot open at all reports
# `Permission denied`, which it reads as an unenforced deny list. Every
# Credential Custody Boundary store is root-owned or 0700 for exactly that
# reason, and `restrict_network` implicitly denies the container sockets, which
# are root-only too.
#
# So custody is held where it is actually enforceable - the executor identity's
# own permissions and the systemd unit's InaccessiblePaths - and this profile
# holds workspace confinement. See docs/research/grok-build-install-and-auth.md
# for the observations, and issue #161 for the unresolved child-process network
# restriction.

[profiles.voice-agent-task]
extends = "workspace"
