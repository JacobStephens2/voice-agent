# Root-managed Grok Build configuration for the Voice Agent's Subagents.
#
# Installed at /etc/voice-agent/grok/config.toml, owned by root, mode 0644.
# It is the only configuration source an accepted run may have: the executor
# reads `grok inspect --json` before every run and pauses the Durable Task if
# any other source, MCP server, plugin, or skill is in effect, so a repository
# cannot replace a boundary by shipping its own configuration file.
#
# Field names here are confirmed against the pinned runner's own inspect output
# during enrollment. A runner release that renames one of them fails closed as
# provider-contract drift rather than silently dropping a boundary.

[update]
# Self-update is the pin's only real adversary: the reviewed digest describes
# bytes that must still be on disk at the next run.
auto_update = false

[models]
# The logical selector xAI recommends for coding and agent sessions. The model
# actually behind it is recorded from every run rather than assumed.
default = "grok-build"

[auth]
# The refresh credential lives with the voice-grok-auth identity and is never
# readable by the executor or by model-selected commands. This broker crosses
# to that identity through one narrow sudoers rule and returns a short-lived
# access token on standard output, which stays in the runner's memory.
auth_provider = "/usr/local/libexec/voice-agent/grok-token-broker"

[shell]
# A model-selected command inherits nothing. An inherited provider, publisher,
# or deployment secret would be readable by every command the model chooses.
environment_policy = "minimal"

[sandbox]
profile = "voice-agent-task"

[sandbox.profiles.voice-agent-task]
# Model-selected tools may write only inside the Delegation root and may not
# open the network themselves. Grok's own model requests are unaffected.
restrict_network = true
deny = [
  "/etc/ssh/**",
  "/etc/voice-agent/**",
  "/home/**",
  "/root/**",
  "/run/voice-agent-broker/**",
  "/run/voice-agent-grok-auth/**",
  "/run/voice-agent-keeplore-publisher/**",
  "/run/voice-agent-subagent/**",
  "/usr/local/libexec/voice-agent/**",
  "/var/lib/voice-agent/**",
  "/var/lib/voice-agent-broker/**",
  "/var/lib/voice-agent-evidence/**",
  "/var/lib/voice-codex/**",
  "/var/lib/voice-grok-auth/**",
]
