# Root-managed Grok Build requirements for the Voice Agent's Subagents.
#
# Installed at /etc/grok/requirements.toml, owned by root, mode 0644.
#
# `requirements` is the one configuration layer a project directory cannot
# override - `grok inspect --json` reports it as a layer with that role, and
# the executor refuses to run unless it is the only layer in effect. The
# previously shipped /etc/voice-agent/grok/config.toml was not a path Grok
# reads at all, and its key names were invented; every name below was observed
# against grok 1.0.13 on this host.

[cli]
# Release builds self-update by default, which is the pin's only real
# adversary. `--no-auto-update` is passed as well, before the subcommand,
# because a flag and a setting fail in different ways.
auto_update = false

[models]
# The logical selector xAI recommends for coding and agent sessions. The model
# actually behind it is recorded from every run rather than assumed.
default = "grok-build"

[auth]
# The refresh credential lives with the voice-grok-auth identity. This broker
# is the only crossing to it, and the model's sandbox cannot invoke it.
auth_provider_command = "/usr/local/libexec/voice-agent/grok-token-broker"

[shell_environment_policy]
# The default inherits the whole environment, including anything matching
# *KEY*, *SECRET*, or *TOKEN*. A model-selected command gets nothing.
inherit = "none"
