<VirtualHost *:80>
    ServerName voice.stephens.page
    Redirect permanent / https://voice.stephens.page/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName voice.stephens.page
    DocumentRoot /opt/voice-agent/current/apps/pwa/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/voice.stephens.page/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/voice.stephens.page/privkey.pem

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3472/api/ connectiontimeout=3 timeout=15
    ProxyPassReverse /api/ http://127.0.0.1:3472/api/
    RequestHeader set X-Forwarded-Proto "https"

    <Directory /opt/voice-agent/current/apps/pwa/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.html [L]
    </Directory>

    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
</IfModule>
